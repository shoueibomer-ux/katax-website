<svg width="1050" height="600" viewBox="0 0 350 200" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif">

  <!-- Card background: muted light navy (washed blue) -->
  <rect x="0" y="0" width="350" height="200" fill="#3E5A72"/>

  <!-- Subtle ledger-line texture -->
  <g opacity="0.06">
    <line x1="0" y1="20" x2="350" y2="20" stroke="#FFFFFF" stroke-width="0.6"/>
    <line x1="0" y1="40" x2="350" y2="40" stroke="#FFFFFF" stroke-width="0.6"/>
    <line x1="0" y1="60" x2="350" y2="60" stroke="#FFFFFF" stroke-width="0.6"/>
    <line x1="0" y1="140" x2="350" y2="140" stroke="#FFFFFF" stroke-width="0.6"/>
    <line x1="0" y1="160" x2="350" y2="160" stroke="#FFFFFF" stroke-width="0.6"/>
    <line x1="0" y1="180" x2="350" y2="180" stroke="#FFFFFF" stroke-width="0.6"/>
  </g>

  <!-- Centered logo lockup -->
  <g transform="translate(133, 82)">
    <rect x="0" y="10" width="7" height="28" fill="#9C3B2E"/>
    <rect x="10" y="0" width="7" height="38" fill="#FFFFFF"/>
    <rect x="20" y="14" width="7" height="24" fill="#9C3B2E"/>
    <text x="36" y="24" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing="0.4">KATAX</text>
    <text x="36" y="36" font-size="7" font-weight="500" fill="#C4D3DE" letter-spacing="0.8">ACCOUNTING &amp; TAX SERVICES</text>
  </g>

  <!-- Tagline -->
  <text x="175" y="128" font-size="8" font-style="italic" fill="#C4D3DE" text-anchor="middle">Your Trusted Partner Along The Way</text>

  <!-- Thin accent rule -->
  <line x1="145" y1="140" x2="205" y2="140" stroke="#9C3B2E" stroke-width="1.2"/>

</svg>
