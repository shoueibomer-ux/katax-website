<svg width="850" height="1100" viewBox="0 0 850 1100" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif">

  <!-- Page background -->
  <rect x="0" y="0" width="850" height="1100" fill="#FFFFFF"/>
  <rect x="1.5" y="1.5" width="847" height="1097" fill="none" stroke="#C7D1D6" stroke-width="3"/>

  <!-- Subtle ledger-line texture across the body -->
  <g opacity="0.045">
    <line x1="0" y1="230" x2="850" y2="230" stroke="#16213E" stroke-width="1"/>
    <line x1="0" y1="270" x2="850" y2="270" stroke="#16213E" stroke-width="1"/>
    <line x1="0" y1="310" x2="850" y2="310" stroke="#16213E" stroke-width="1"/>
    <line x1="0" y1="350" x2="850" y2="350" stroke="#16213E" stroke-width="1"/>
    <line x1="0" y1="390" x2="850" y2="390" stroke="#16213E" stroke-width="1"/>
    <line x1="0" y1="430" x2="850" y2="430" stroke="#16213E" stroke-width="1"/>
    <line x1="0" y1="470" x2="850" y2="470" stroke="#16213E" stroke-width="1"/>
    <line x1="0" y1="510" x2="850" y2="510" stroke="#16213E" stroke-width="1"/>
    <line x1="0" y1="550" x2="850" y2="550" stroke="#16213E" stroke-width="1"/>
    <line x1="0" y1="590" x2="850" y2="590" stroke="#16213E" stroke-width="1"/>
    <line x1="0" y1="630" x2="850" y2="630" stroke="#16213E" stroke-width="1"/>
    <line x1="0" y1="670" x2="850" y2="670" stroke="#16213E" stroke-width="1"/>
    <line x1="0" y1="710" x2="850" y2="710" stroke="#16213E" stroke-width="1"/>
    <line x1="0" y1="750" x2="850" y2="750" stroke="#16213E" stroke-width="1"/>
    <line x1="0" y1="790" x2="850" y2="790" stroke="#16213E" stroke-width="1"/>
    <line x1="0" y1="830" x2="850" y2="830" stroke="#16213E" stroke-width="1"/>
  </g>

  <!-- Top curved navy band -->
  <path d="M0,0 H850 V150 Q425,192 0,150 Z" fill="#16213E"/>

  <!-- Logo lockup on the navy band (gold bars) -->
  <g transform="translate(60, 48)">
    <rect x="0" y="17" width="13" height="46" fill="#D3A34F"/>
    <rect x="17" y="0" width="13" height="63" fill="#FFFFFF"/>
    <rect x="34" y="24" width="13" height="39" fill="#D3A34F"/>
    <text x="63" y="38" font-size="34" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">KATAX</text>
    <text x="63" y="57" font-size="12.5" font-weight="500" fill="#E4CFA0" letter-spacing="1.2">ACCOUNTING &amp; TAX SERVICES</text>
  </g>

  <!-- File reference, top-right on navy band -->
  <text x="790" y="45" font-size="11" fill="#E4CFA0" text-anchor="end" letter-spacing="0.5">KAYA FOR ACCOUNTING</text>
  <text x="790" y="60" font-size="11" fill="#E4CFA0" text-anchor="end" letter-spacing="0.5">&amp; TAX SERVICE INC.</text>

  <!-- Centered logo watermark -->
  <g transform="translate(179, 511)" opacity="0.03" fill="#8A6D3A">
    <rect x="0" y="40" width="34" height="90"/>
    <rect x="44" y="0" width="34" height="130"/>
    <rect x="88" y="54" width="34" height="76"/>
    <text x="162" y="98" font-size="108" font-weight="700" letter-spacing="1">KATAX</text>
  </g>

  <!-- Letter meta fields -->
  <text x="60" y="250" font-size="13" fill="#5B6472">Date:</text>
  <text x="60" y="285" font-size="13" fill="#5B6472">Recipient Name:</text>
  <text x="60" y="320" font-size="13" fill="#5B6472">Designation:</text>
  <text x="60" y="365" font-size="14" font-weight="700" fill="#16213E">Subject:</text>

  <!-- Body area intentionally left blank for letter content -->

  <!-- Bottom curved band: layered cream + gold -->
  <path d="M0,1100 H850 V965 Q425,918 0,965 Z" fill="#D3A34F"/>
  <path d="M0,1100 H850 V978 Q425,933 0,978 Z" fill="#F1E1BB"/>

  <!-- Footer contact columns with icon badges -->
  <g font-size="13" fill="#2A241F" font-weight="500" text-anchor="middle">

    <!-- phone -->
    <circle cx="180" cy="998" r="16" fill="#16213E"/>
    <g transform="translate(171.5, 989.5)" stroke="#D3A34F" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 1.2h2.6l1.1 3-1.6 1.3a9.6 9.6 0 0 0 5 5l1.3-1.6 3 1.1v2.6c0 .9-.8 1.6-1.6 1.6C4.9 14.2.8 10.1 0 4.6c0-.8.7-1.6.8-2.4z" transform="scale(1)"/>
    </g>
    <text x="180" y="1028">437-230-5860</text>

    <!-- email + website -->
    <circle cx="425" cy="998" r="16" fill="#16213E"/>
    <g transform="translate(414.5, 988.5)" stroke="#D3A34F" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="21" height="15" rx="2"/>
      <path d="M0.6 1 10.5 9.5 20.4 1"/>
    </g>
    <text x="425" y="1028">admin@katax.ca</text>
    <text x="425" y="1042" font-size="11" fill="#8A6D3A">www.katax.ca</text>

    <!-- address -->
    <circle cx="670" cy="998" r="16" fill="#16213E"/>
    <g transform="translate(661.5, 987.5)" stroke="#D3A34F" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 21s7.7-7 7.7-12.9A7.7 7.7 0 0 0 1.3 8.1C1.3 14 9 21 9 21z" transform="scale(0.82)"/>
      <circle cx="9" cy="8.1" r="2.7" transform="scale(0.82)"/>
    </g>
    <text x="670" y="1028">Toronto, ON M1E 4Y2</text>
  </g>

  <!-- Divider -->
  <line x1="240" y1="1052" x2="610" y2="1052" stroke="#16213E" stroke-width="0.75" opacity="0.3"/>

  <!-- Sender line -->
  <text x="425" y="1068" font-size="13" font-weight="700" fill="#16213E" text-anchor="middle">ESSA ISMAIL — Principal</text>

  <!-- Tagline + credential -->
  <text x="425" y="1082" font-size="10.5" font-style="italic" fill="#8A6D3A" text-anchor="middle">Your Trusted Partner Along The Way</text>
  <text x="425" y="1096" font-size="9.5" font-weight="700" fill="#16213E" text-anchor="middle" letter-spacing="0.5">E-FILE CERTIFIED  ·  GST/HST REGISTERED</text>

</svg>
