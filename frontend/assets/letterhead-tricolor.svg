<svg width="850" height="1100" viewBox="0 0 850 1100" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans','Helvetica Neue',Arial,sans-serif">

  <!-- Page background, plain white with a visible outline -->
  <rect x="0" y="0" width="850" height="1100" fill="#FFFFFF"/>
  <rect x="1.5" y="1.5" width="847" height="1097" fill="none" stroke="#C7D1D6" stroke-width="3"/>

  <!-- Logo lockup, top-left, directly on white — no color band -->
  <g transform="translate(60, 55)">
    <rect x="0" y="17" width="13" height="46" fill="#C0272D"/>
    <rect x="17" y="0" width="13" height="63" fill="#1B1B1B"/>
    <rect x="34" y="24" width="13" height="39" fill="#1C7A3B"/>
    <text x="63" y="38" font-size="34" font-weight="700" fill="#16213E" letter-spacing="0.5">KATAX</text>
    <text x="63" y="57" font-size="12.5" font-weight="500" fill="#5B6472" letter-spacing="1.2">ACCOUNTING &amp; TAX SERVICES</text>
  </g>

  <!-- Sender line + tagline, under the logo -->
  <text x="60" y="140" font-size="10.5" font-style="italic" fill="#5B6472">Your Trusted Partner Along The Way</text>

  <!-- Centered logo watermark -->
  <g transform="translate(179, 511)" opacity="0.025" fill="#16213E">
    <rect x="0" y="40" width="34" height="90"/>
    <rect x="44" y="0" width="34" height="130"/>
    <rect x="88" y="54" width="34" height="76"/>
    <text x="162" y="98" font-size="108" font-weight="700" letter-spacing="1">KATAX</text>
  </g>

  <!-- Body area intentionally left blank for letter content -->

  <!-- Footer: no band, no divider rule — content sits directly on white -->
  <g font-size="13" fill="#2A241F" font-weight="500" text-anchor="middle">

    <!-- phone -->
    <circle cx="180" cy="990" r="15" fill="#1B1B1B"/>
    <g transform="translate(171.5, 981.5)" stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 1.2h2.6l1.1 3-1.6 1.3a9.6 9.6 0 0 0 5 5l1.3-1.6 3 1.1v2.6c0 .9-.8 1.6-1.6 1.6C4.9 14.2.8 10.1 0 4.6c0-.8.7-1.6.8-2.4z"/>
    </g>
    <text x="180" y="1020">437-230-5860</text>

    <!-- email + website -->
    <circle cx="425" cy="990" r="15" fill="#1B1B1B"/>
    <g transform="translate(414.5, 980.5)" stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="21" height="15" rx="2"/>
      <path d="M0.6 1 10.5 9.5 20.4 1"/>
    </g>
    <text x="425" y="1020">admin@katax.ca</text>
    <text x="425" y="1034" font-size="11" fill="#5B6472">www.katax.ca</text>

    <!-- address -->
    <circle cx="670" cy="990" r="15" fill="#1B1B1B"/>
    <g transform="translate(661.5, 979.5)" stroke="#FFFFFF" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 21s7.7-7 7.7-12.9A7.7 7.7 0 0 0 1.3 8.1C1.3 14 9 21 9 21z" transform="scale(0.82)"/>
      <circle cx="9" cy="8.1" r="2.7" transform="scale(0.82)"/>
    </g>
    <text x="670" y="1020">Toronto, ON M1E 4Y2</text>
  </g>

</svg>
